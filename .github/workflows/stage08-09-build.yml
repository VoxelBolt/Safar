name: Safar Stage 08-09 Build

on:
  push:
    branches:
      - main
      - stage-08-09-favorites-profile-statistics-localization-errors
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build packages
        run: |
          sdkmanager "build-tools;35.0.0" "platform-tools"
          curl -fsSL "https://dl.google.com/android/repository/platform-37.0_r01.zip" -o /tmp/platform-37.0_r01.zip
          unzip -o -q /tmp/platform-37.0_r01.zip -d "$ANDROID_HOME/platforms"
          rm -rf "$ANDROID_HOME/platforms/android-37"
          mv "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build and test
        run: gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace
