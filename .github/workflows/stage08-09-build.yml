name: Safar Stage 08-09 Build

on:
  push:
    branches:
      - stage-08-09-favorites-profile-statistics-localization-errors
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          sed -i -e "s/compileSdk = 37/compileSdk = 36/" -e "s/targetSdk = 37/targetSdk = 36/" app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build and test
        env:
          SUPABASE_URL: ''
          SUPABASE_PUBLISHABLE_KEY: ''
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace
